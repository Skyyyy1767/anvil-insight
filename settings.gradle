pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		maven {
			name = 'Quilt'
			url = 'https://maven.quiltmc.org/repository/release/'
		}
		maven {
			name = 'Forge'
			url = 'https://maven.minecraftforge.net/'
		}
		gradlePluginPortal()
		mavenCentral()
	}
}

rootProject.name = 'anvil-insight'

include 'fabric', 'quilt', 'neoforge', 'forge'
