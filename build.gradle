plugins {
	id 'base'
}

group = project.maven_group
version = project.mod_version

tasks.register('buildAll') {
	group = 'build'
	description = 'Builds every loader distribution.'
	dependsOn subprojects.collect { it.tasks.named('build') }
}

tasks.named('build') {
	dependsOn tasks.named('buildAll')
}

tasks.register('runFabricClient') {
	group = 'application'
	description = 'Runs the Fabric development client.'
	dependsOn ':fabric:runClient'
}

tasks.register('runQuiltClient') {
	group = 'application'
	description = 'Runs the Quilt development client.'
	dependsOn ':quilt:runClient'
}

tasks.register('runNeoForgeClient') {
	group = 'application'
	description = 'Runs the NeoForge development client.'
	dependsOn ':neoforge:runClient'
}

tasks.register('runForgeClient') {
	group = 'application'
	description = 'Runs the Forge development client.'
	dependsOn ':forge:runClient'
}
