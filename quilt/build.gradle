plugins {
	id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}"
}

version = rootProject.version
group = rootProject.group

base {
	archivesName = "${rootProject.name}-quilt"
}

def quiltDevelopmentJar = layout.buildDirectory.file(
	"libs/${rootProject.name}-quilt-${project.version}.jar"
)

repositories {
	maven {
		name = 'Quilt'
		url = 'https://maven.quiltmc.org/repository/release/'
	}
}

configurations {
	quiltRuntimeMods
}

loom {
	runs {
		client {
			client()
			name = 'Quilt Client'
			runDir = rootProject.file('run/quilt')
			defaultMainClass = 'org.quiltmc.loader.impl.launch.knot.KnotClient'
			vmArg "-Dloader.addMods=${quiltDevelopmentJar.get().asFile.absolutePath}"
		}
	}

	mods {
		"${quilt_mod_id}" {
			sourceSet sourceSets.main
		}
	}
}

tasks.named('runClient') {
	dependsOn tasks.named('jar')
}

sourceSets.main {
	java.srcDir rootProject.file('common/src/main/java')
	resources.srcDir rootProject.file('common/src/main/resources')
}

dependencies {
	minecraft "com.mojang:minecraft:${minecraft_version}"
	implementation "org.quiltmc:quilt-loader:${quilt_loader_version}"
	quiltRuntimeMods fabricApi.module('fabric-resource-loader-v1', fabric_api_version)
	compileOnly "net.fabricmc:sponge-mixin:${mixin_version}"
	runtimeOnly "net.fabricmc:sponge-mixin:${mixin_version}"
	runtimeOnly 'org.quiltmc:quilt-json5:1.0.4+final'
	runtimeOnly 'org.ow2.asm:asm:9.10.1'
	runtimeOnly 'org.ow2.asm:asm-analysis:9.10.1'
	runtimeOnly 'org.ow2.asm:asm-commons:9.10.1'
	runtimeOnly 'org.ow2.asm:asm-tree:9.10.1'
	runtimeOnly 'org.ow2.asm:asm-util:9.10.1'
	runtimeOnly 'org.quiltmc:quilt-config:1.3.3'
	runtimeOnly 'io.github.llamalad7:mixinextras-fabric:0.5.5'
}

def stageQuiltRuntimeMods = tasks.register('stageQuiltRuntimeMods', Copy) {
	from configurations.quiltRuntimeMods
	into rootProject.file('run/quilt/mods')
}

tasks.named('runClient') {
	dependsOn stageQuiltRuntimeMods
}

processResources {
	def replaceProperties = [
		version              : project.version,
		group                : project.group,
		quilt_loader_version : quilt_loader_version,
		fabric_resource_loader_version : fabric_resource_loader_version,
		minecraft_version    : minecraft_version
	]
	inputs.properties replaceProperties

	filesMatching('quilt.mod.json') {
		expand replaceProperties
	}
}

tasks.withType(JavaCompile).configureEach {
	options.release = java_version as int
	options.encoding = 'UTF-8'
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.toVersion(java_version)
	targetCompatibility = JavaVersion.toVersion(java_version)
}

jar {
	from(rootProject.file('LICENSE')) {
		rename { "${it}_${rootProject.name}" }
	}
}
